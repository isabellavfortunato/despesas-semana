<style>
  :root{
    --creme:#e8ecf1;
    --vermelho:#0f2133;
    --laranja:#89a5c0;
    --vinho:#3e4c59;
    --escuro:#192633;
    --cinza:#ccd1d6;
    --cinzaTx:#7d858c;
    --carta:#f7fafd;
    --fg:#f2f7fb;
    --ctrl:rgba(242,247,251,.22);
    --serif:"Cambria", Georgia, "Times New Roman", serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--creme);
    color:var(--escuro);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:20px 16px 48px;
  }
  .wrap{ max-width:1400px; margin:0 auto; }
  .topo{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; }
  h1{ margin:0; font-family:var(--serif); font-weight:700; font-size:30px; color:var(--vinho); letter-spacing:-.01em; }
  .sub{ margin:4px 0 0; font-size:14px; color:var(--cinzaTx); }
  .nav{ display:flex; align-items:center; gap:8px; }
  .btnNav{ width:38px; height:38px; border-radius:9px; border:1px solid rgba(62,76,89,.25); background:var(--carta); color:var(--vinho); font-size:20px; line-height:1; cursor:pointer; font-family:var(--serif); font-weight:700; }
  .btnNav:disabled{ opacity:.4; cursor:default; }
  .btnHoje{ height:38px; padding:0 14px; border-radius:9px; border:1px solid rgba(62,76,89,.25); background:var(--carta); color:var(--vinho); cursor:pointer; font-size:13px; font-weight:600; }
  .semana{ font-family:var(--serif); font-weight:700; color:var(--escuro); min-width:120px; text-align:center; font-size:15px; }

  .resumo{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .chip{ display:flex; flex-direction:column; gap:2px; background:var(--carta); border:1px solid rgba(25,38,51,.12); border-radius:10px; padding:8px 14px; min-width:140px; }
  .chip .rot{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; opacity:.7; }
  .chip .val{ font-family:var(--serif); font-weight:700; font-size:19px; }
  .chip.empresa{ border-left:5px solid var(--vermelho); }
  .chip.pessoal{ border-left:5px solid var(--laranja); }
  .chip.geral{ background:var(--vinho); color:#f2f7fb; border-color:var(--vinho); border-left:5px solid var(--vinho); }
  .chip.pago{ border-left:5px solid #7d858c; }

  .legenda{ font-size:12.5px; color:var(--cinzaTx); line-height:1.6; margin-bottom:16px; background:rgba(62,76,89,.05); border:1px solid rgba(62,76,89,.12); border-radius:10px; padding:10px 12px; }
  .legenda b.v{ color:var(--vermelho); }
  .legenda b.l{ color:var(--laranja); }

  .scroll{ overflow-x:auto; padding-bottom:6px; }
  .grade{ display:grid; grid-template-columns:repeat(7, minmax(150px,1fr)); gap:8px; min-width:1050px; }
  .coluna{ display:flex; flex-direction:column; background:var(--carta); border:1px solid rgba(25,38,51,.10); border-radius:12px; overflow:hidden; min-height:190px; transition:box-shadow .12s ease, border-color .12s ease; }
  .coluna.hoje{ border:2px solid #7d858c; }
  .coluna.alvo{ border:2px dashed var(--vinho); box-shadow:0 0 0 4px rgba(62,76,89,.10); }
  .cabDia{ padding:8px 10px; border-bottom:1px solid rgba(25,38,51,.08); }
  .coluna.hoje .cabDia{ background:#7d858c; color:#f2f7fb; }
  .cabDia .dow{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.8; }
  .cabDia .num{ font-family:var(--serif); font-weight:700; font-size:20px; line-height:1; }
  .cabDia .mes{ font-size:11px; opacity:.7; }
  .corpo{ padding:8px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .vazio{ font-size:12px; color:rgba(25,38,51,.28); text-align:center; padding:18px 4px; }
  .rodapeDia{ padding:8px 10px; background:rgba(62,76,89,.06); border-top:1px solid rgba(25,38,51,.08); display:flex; justify-content:space-between; align-items:baseline; }
  .rodapeDia .rot{ font-size:11px; color:var(--cinzaTx); text-transform:uppercase; letter-spacing:.06em; }
  .rodapeDia .val{ font-family:var(--serif); font-weight:700; font-size:15px; color:var(--vinho); }

  .conta{ border-radius:9px; padding:7px 8px; box-shadow:0 1px 2px rgba(25,38,51,.18); }
  .conta.empresa{ background:var(--vermelho); }
  .conta.pessoal{ background:var(--laranja); }
  .conta.pulada{ background:var(--cinza); }
  .conta.paga{ opacity:.5; }
  .linhaTopo{ display:flex; align-items:flex-start; gap:6px; }
  .alca{ touch-action:none; cursor:grab; padding:2px 1px; flex-shrink:0; display:flex; align-items:center; }
  .marca{ flex-shrink:0; width:16px; height:16px; margin-top:1px; border-radius:50%; border:2px solid var(--fg); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .marca.on{ background:var(--fg); }
  .conta.pulada .marca{ border-color:var(--cinzaTx); }
  .nome{ font-size:13.5px; font-weight:600; color:var(--fg); line-height:1.25; margin-top:5px; overflow-wrap:break-word; }
  .conta.pulada .nome{ color:var(--cinzaTx); text-decoration:line-through; }
  .badgePaga{ display:none; margin-top:3px; margin-left:2px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--fg); }
  .conta.paga .badgePaga{ display:inline-block; }
  .acoes{ display:flex; gap:4px; flex-shrink:0; }
  .miniBtn{ width:17px; height:17px; border:none; background:transparent; color:var(--fg); opacity:.6; cursor:pointer; font-size:14px; line-height:1; padding:0; border-radius:4px; }
  .miniBtn:hover{ opacity:1; }
  .conta.pulada .miniBtn{ color:var(--cinzaTx); }
  .miniBtn.pular.on{ opacity:1; background:rgba(25,38,51,.25); }
  .linhaValor{ display:flex; align-items:center; gap:4px; margin-top:6px; margin-left:2px; }
  .linhaValor .cifrao{ font-size:12px; color:var(--fg); opacity:.9; }
  .conta.pulada .linhaValor .cifrao{ color:var(--cinzaTx); }
  .linhaValor input{ flex:1; width:100%; min-width:0; background:rgba(242,247,251,.92); border:none; border-radius:5px; padding:3px 6px; font-size:13px; font-weight:600; color:var(--escuro); font-family:var(--serif); outline:none; }

  .fantasma{ position:fixed; pointer-events:none; z-index:9999; color:#fff8f2; padding:6px 12px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(25,38,51,.35); white-space:nowrap; transform:translate(-50%,-120%); }

  .barra{ margin-top:20px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; align-items:center; }
  .btnAcao{ height:36px; padding:0 14px; border-radius:9px; border:1px solid rgba(62,76,89,.25); background:var(--carta); color:var(--vinho); cursor:pointer; font-size:13px; font-weight:600; }
  .btnAcao.forte{ background:var(--vermelho); color:#fff; border-color:var(--vermelho); }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--vinho); color:#f2f7fb; padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(25,38,51,.35); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:10000; max-width:88%; text-align:center; }
  .toast.show{ opacity:1; }

  .form{ margin-top:14px; background:var(--carta); border:1px solid rgba(25,38,51,.12); border-radius:12px; padding:14px; display:none; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .form.aberto{ display:flex; }
  .campo{ display:flex; flex-direction:column; gap:4px; }
  .campo label{ font-size:11.5px; color:var(--cinzaTx); text-transform:uppercase; letter-spacing:.05em; }
  .campo input{ height:34px; border:1px solid rgba(25,38,51,.18); border-radius:7px; padding:0 8px; font-size:14px; font-family:var(--serif); color:var(--escuro); background:#fff; }
  .tipos{ display:flex; gap:6px; }
  .tipoBtn{ height:34px; padding:0 12px; border-radius:7px; border:1px solid rgba(25,38,51,.18); background:#fff; cursor:pointer; font-size:13px; font-weight:600; color:var(--cinzaTx); }
  .tipoBtn.sel.empresa{ background:var(--vermelho); color:#fff; border-color:var(--vermelho); }
  .tipoBtn.sel.pessoal{ background:var(--laranja); color:#fff; border-color:var(--laranja); }
  .authBar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; background:var(--vinho); color:#f2f7fb; border-radius:10px; padding:9px 14px; margin-bottom:14px; }
  .authStatus{ font-size:13px; }
  .btnAuth{ height:32px; padding:0 14px; border-radius:8px; border:none; background:#f2f7fb; color:var(--vinho); font-weight:600; font-size:13px; cursor:pointer; }
  .btnAuth.ghost{ background:transparent; color:#f2f7fb; border:1px solid rgba(242,247,251,.6); }
  /* Calculadora de pagamento */
  .calcOverlay{ position:fixed; inset:0; background:rgba(25,38,51,.55); display:none; align-items:center; justify-content:center; z-index:10001; padding:16px; }
  .calcOverlay.aberto{ display:flex; }
  .calcModal{ background:var(--creme); width:100%; max-width:540px; max-height:88vh; border-radius:16px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(25,38,51,.5); }
  .calcHead{ padding:15px 18px; background:var(--vinho); color:#f2f7fb; display:flex; align-items:center; justify-content:space-between; }
  .calcHead h2{ margin:0; font-family:var(--serif); font-size:20px; font-weight:700; }
  .calcFechX{ background:transparent; border:none; color:#f2f7fb; font-size:24px; cursor:pointer; line-height:1; padding:0; }
  .calcTopo{ padding:14px 18px 8px; display:flex; flex-direction:column; gap:10px; }
  .calcSaldo{ display:flex; flex-direction:column; gap:4px; }
  .calcSaldo label{ font-size:12px; color:var(--cinzaTx); text-transform:uppercase; letter-spacing:.05em; }
  .calcSaldo input{ height:38px; border:1px solid rgba(25,38,51,.2); border-radius:8px; padding:0 10px; font-size:15px; font-family:var(--serif); color:var(--escuro); background:#fff; }
  .calcAtalhos{ display:flex; flex-wrap:wrap; gap:6px; }
  .calcAtalho{ height:32px; padding:0 12px; border-radius:16px; border:1px solid rgba(62,76,89,.3); background:#fff; color:var(--vinho); font-size:12px; font-weight:600; cursor:pointer; }
  .calcLista{ flex:1; overflow-y:auto; padding:6px 12px 12px; display:flex; flex-direction:column; gap:6px; }
  .calcRow{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:#f7fafd; border:1px solid rgba(25,38,51,.08); cursor:pointer; }
  .calcRow.sel{ background:rgba(62,76,89,.18); border-color:#3e4c59; }
  .calcCheck{ width:18px; height:18px; border-radius:5px; border:2px solid var(--cinzaTx); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .calcRow.sel .calcCheck{ background:#3e4c59; border-color:#3e4c59; }
  .calcDia{ font-family:var(--serif); font-weight:700; font-size:14px; color:var(--escuro); width:26px; text-align:center; flex-shrink:0; }
  .calcTag{ width:20px; height:20px; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#f2f7fb; }
  .tagP{ background:var(--laranja); color:#192633; }
  .tagE{ background:var(--vermelho); }
  .tagAtraso{ background:#c62a12; }
  .calcNome{ flex:1; font-size:13px; color:var(--escuro); }
  .calcValor{ font-family:var(--serif); font-weight:700; font-size:14px; color:var(--escuro); flex-shrink:0; }
  .calcRodape{ padding:14px 18px; border-top:1px solid rgba(25,38,51,.12); background:#f7fafd; }
  .calcLinhaTotal{ display:flex; justify-content:space-between; align-items:baseline; }
  .calcLinhaTotal .rot{ font-size:12px; color:var(--cinzaTx); text-transform:uppercase; letter-spacing:.05em; }
  .calcLinhaTotal .val{ font-family:var(--serif); font-weight:700; font-size:20px; color:var(--vinho); }
  .calcDif{ margin-top:6px; display:flex; justify-content:space-between; align-items:baseline; font-weight:700; font-size:14px; }
  .calcDif.sobra{ color:#1f7a4d; }
  .calcDif.falta{ color:#c62a12; }
  .tipoBtn.repsel.sel{ background:var(--vinho); color:#fff; border-color:var(--vinho); }
  .delOverlay{ position:fixed; inset:0; background:rgba(25,38,51,.55); display:flex; align-items:center; justify-content:center; z-index:10002; padding:16px; }
  .delBox{ background:var(--creme); border-radius:14px; max-width:360px; width:100%; padding:18px; box-shadow:0 16px 48px rgba(25,38,51,.5); }
  .delTitulo{ font-family:var(--serif); font-weight:700; font-size:18px; color:var(--vinho); margin-bottom:6px; }
  .delSub{ font-size:13px; color:var(--cinzaTx); margin-bottom:14px; line-height:1.5; }
  .delAcoes{ display:flex; flex-direction:column; gap:8px; }
  .delAcoes .btnAcao{ width:100%; }
  .moverDia{ display:flex; gap:2px; flex-shrink:0; }
  .setaDia{ width:16px; height:20px; border:none; background:var(--ctrl); color:var(--fg); font-size:14px; line-height:1; cursor:pointer; border-radius:5px; padding:0; font-weight:700; }
  .setaDia:active{ background:rgba(242,247,251,.42); }
  .conta.pulada .setaDia{ color:#7d858c; background:rgba(25,38,51,.08); }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap">
  <div class="authBar" id="authBar" style="display:none;">
    <span class="authStatus" id="authStatus"></span>
    <span>
      <button class="btnAuth" id="btnEntrar" style="display:none;">Entrar com o Google</button>
      <button class="btnAuth ghost" id="btnSair" style="display:none;">Sair</button>
    </span>
  </div>
  <div class="topo">
    <div>
      <h1>Despesas da semana</h1>
      <p class="sub" id="rangeLabel"></p>
    </div>
    <div class="nav">
      <button class="btnHoje" id="btnHoje">Hoje</button>
      <button class="btnNav" id="antes">‹</button>
      <span class="semana" id="semanaLabel"></span>
      <button class="btnNav" id="depois">›</button>
    </div>
  </div>

  <div class="resumo">
    <div class="chip empresa"><span class="rot">Empresa a pagar</span><span class="val" id="totEmpresa">R$ 0,00</span></div>
    <div class="chip pessoal"><span class="rot">Pessoal a pagar</span><span class="val" id="totPessoal">R$ 0,00</span></div>
    <div class="chip geral"><span class="rot">A pagar na semana</span><span class="val" id="totGeral">R$ 0,00</span></div>
    <div class="chip pago"><span class="rot">Já pago na semana</span><span class="val" id="totPago">R$ 0,00</span></div>
  </div>

  <div class="scroll">
    <div class="grade" id="grade"></div>
  </div>

  <div class="barra">
    <button class="btnAcao forte" id="btnCalc">Calculadora de pagamento</button>
    <button class="btnAcao" id="btnRelatorio">Relatório do mês</button>
    <button class="btnAcao" id="btnNova">Adicionar conta</button>
    <button class="btnAcao" id="btnReset">Restaurar contas originais</button>
  </div>

  <div class="form" id="form">
    <div class="campo" style="flex:2; min-width:180px;">
      <label>Nome</label>
      <input type="text" id="fNome" placeholder="Nome da conta">
    </div>
    <div class="campo">
      <label>Tipo</label>
      <div class="tipos">
        <button class="tipoBtn empresa sel" id="fEmpresa">Empresa</button>
        <button class="tipoBtn pessoal" id="fPessoal">Pessoal</button>
      </div>
    </div>
    <div class="campo">
      <label>Repetição</label>
      <div class="tipos">
        <button class="tipoBtn repsel sel" id="fRepMensal">Todo mês</button>

  function semear(){ return BASE.map(function(c){ return { id:c.id, nome:c.nome, tipo:c.tipo, dia:c.dia, valor:c.valor, repete:true, removidos:[], statusMes:{} }; }); }

  function normalizar(lista){
    var mesAtual = chaveMes(hoje.getFullYear(), hoje.getMonth());
    return lista.map(function(c){
      if("ativo" in c){ if(!c.status){ c.status = (c.ativo === false) ? "pulada" : "aberta"; } delete c.ativo; }
      if(c.repete === undefined){ c.repete = true; }
      if(c.repete){
        if(!c.removidos){ c.removidos = []; }
        if(!c.statusMes){ c.statusMes = {}; }
        if(c.status && c.status !== "aberta"){ c.statusMes[mesAtual] = c.status; }
        if("status" in c){ delete c.status; }
      } else {
        if(!c.status){ c.status = "aberta"; }
      }
      return c;
    });
  }

  // Armazenamento: usa window.storage dentro do Claude, localStorage no GitHub, memória se nada existir.
  var store = {
    get: function(k){
      return new Promise(function(res){
        try{
          if(window.storage && window.storage.get){
            window.storage.get(k).then(function(r){ res(r ? r.value : null); }).catch(function(){ res(localGet(k)); });
            return;
          }
        }catch(e){}
        res(localGet(k));
      });
    },
    set: function(k,v){
      try{
        if(window.storage && window.storage.set){ window.storage.set(k,v).catch(function(){ localSet(k,v); }); return; }
      }catch(e){}
      localSet(k,v);
    }
  };
  function localGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function localSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  function parseValor(t){
    if(t==null) return 0;
    var s = String(t).trim(); if(!s) return 0;
    var limpo = s.replace(/[^0-9.,-]/g,"").replace(/\./g,"").replace(",",".");
    var n = parseFloat(limpo); return isNaN(n) ? 0 : n;
  }
  function formatValor(n){ return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }

  function segundaDaSemana(base){ var x=new Date(base); var dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); x.setHours(0,0,0,0); return x; }
  function addDias(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function ultimoDia(ano,mes){ return new Date(ano,mes+1,0).getDate(); }
  function mesmoDia(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function pad2(n){ return (n<10?"0":"")+n; }
  function chaveMes(y,m){ return y + "-" + pad2(m+1); }
  function chaveDia(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function fromISO(s){ if(!s) return null; var pp=String(s).split("-"); if(pp.length!==3) return null; var d=new Date(+pp[0],+pp[1]-1,+pp[2]); d.setHours(0,0,0,0); return d; }
  function nomeMesAno(y,m){ var M=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"]; return M[m]+" de "+y; }
  function statusDe(c, data){
    if(c.repete === false){ return c.status || "aberta"; }
    var ym = chaveMes(data.getFullYear(), data.getMonth());
    return (c.statusMes && c.statusMes[ym]) || "aberta";
  }
  function definirStatus(c, data, novo){
    if(c.repete === false){ c.status = novo; return; }
    var ym = chaveMes(data.getFullYear(), data.getMonth());
    c.statusMes = c.statusMes || {};
    if(novo === "aberta"){ delete c.statusMes[ym]; } else { c.statusMes[ym] = novo; }
  }

  var contas = [];
  var inicioSemana = segundaDaSemana(new Date());
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var tipoNovo = "empresa";

  var refDias = [], refTotDia = [], refEmpresa, refPessoal, refGeral, refPago;

  function contasDoDia(data){
    var y=data.getFullYear(), m=data.getMonth(), dd=data.getDate();
    var ym=chaveMes(y,m), ymd=chaveDia(data), ult=ultimoDia(y,m);
    return contas.filter(function(c){
      if(c.repete === false){ return c.data === ymd; }
      if(c.removidos && c.removidos.indexOf(ym) !== -1) return false;
      return Math.min(c.dia, ult) === dd;
    });
  }
  function contasDaSemana(){
    var lista = [];
    for(var i=0;i<7;i++){ contasDoDia(addDias(inicioSemana,i)).forEach(function(c){ lista.push(c); }); }
    return lista;
  }

  function atualizarTotais(){
    var e=0, p=0, pago=0;
    for(var i=0;i<7;i++){
      var d = refDias[i];
      var td = 0;
      contasDoDia(d).forEach(function(c){
        var st = statusDe(c, d), v = parseValor(c.valor);
        if(st === "aberta"){ td += v; if(c.tipo==="empresa") e += v; else p += v; }
        else if(st === "paga"){ pago += v; }
      });
      if(refTotDia[i]) refTotDia[i].textContent = "R$ " + formatValor(td);
    }
    refEmpresa.textContent = "R$ " + formatValor(e);
    refPessoal.textContent = "R$ " + formatValor(p);
    refGeral.textContent = "R$ " + formatValor(e+p);
    refPago.textContent = "R$ " + formatValor(pago);
  }

  function salvar(){
    if(NUVEM){ salvarNuvem(); } else { store.set(CHAVE, JSON.stringify(contas)); }
  }
  function salvarNuvem(){
    if(!docRef) return;
    lastJSON = JSON.stringify(contas);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      docRef.set({ contas: contas, atualizadoEm: Date.now() }).catch(function(e){ console.warn("Erro ao salvar:", e); });
    }, 400);
  }
  function aplicarPendente(){
    if(pendingRemote){
      contas = normalizar(pendingRemote); pendingRemote = null;
      lastJSON = JSON.stringify(contas); render();
    }
  }

  function pontinhos(cor){
    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width","10"); svg.setAttribute("height","16"); svg.setAttribute("viewBox","0 0 10 16");
    [3,8,13].forEach(function(cy){ [2.5,7.5].forEach(function(cx){
      var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r","1.3"); c.setAttribute("fill",cor); c.setAttribute("opacity","0.75");
      svg.appendChild(c);
    }); });
    return svg;
  }

  function criaConta(c, dataCol){
    var cor = c.tipo === "empresa" ? "#0f2133" : "#89a5c0";
    var st = statusDe(c, dataCol);
    var wrap = document.createElement("div");
    wrap.className = "conta " + c.tipo + (st==="paga" ? " paga" : "") + (st==="pulada" ? " pulada" : "");
    wrap.style.setProperty("--fg", c.tipo === "empresa" ? "#f2f7fb" : "#192633");
    wrap.style.setProperty("--ctrl", c.tipo === "empresa" ? "rgba(242,247,251,.22)" : "rgba(25,38,51,.16)");

    var topo = document.createElement("div");
    topo.className = "linhaTopo";

    var mover = document.createElement("div");
    mover.className = "moverDia";
    var bAnt = document.createElement("button");
    bAnt.className = "setaDia"; bAnt.textContent = "‹"; bAnt.title = "Mover para o dia anterior";
    bAnt.addEventListener("click", function(){ nudge(c, dataCol, -1); });
    var bProx = document.createElement("button");
    bProx.className = "setaDia"; bProx.textContent = "›"; bProx.title = "Mover para o próximo dia";
    bProx.addEventListener("click", function(){ nudge(c, dataCol, 1); });
    mover.appendChild(bAnt); mover.appendChild(bProx);
    topo.appendChild(mover);

    var marca = document.createElement("button");
    marca.className = "marca" + (st==="paga" ? " on" : "");
    marca.title = st==="paga" ? "Desfazer pagamento" : "Marcar como paga";
    if(st==="paga"){
      var chk = document.createElementNS("http://www.w3.org/2000/svg","svg");
      chk.setAttribute("width","9"); chk.setAttribute("height","9"); chk.setAttribute("viewBox","0 0 12 12");
      var path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d","M2 6.5 L5 9.5 L10 3"); path.setAttribute("fill","none");
      path.setAttribute("stroke",cor); path.setAttribute("stroke-width","2.2");
      path.setAttribute("stroke-linecap","round"); path.setAttribute("stroke-linejoin","round");
      chk.appendChild(path); marca.appendChild(chk);
    }
    marca.addEventListener("click", function(){ definirStatus(c, dataCol, st==="paga" ? "aberta" : "paga"); salvar(); render(); });
    topo.appendChild(marca);

    var espaco = document.createElement("div");
    espaco.style.flex = "1";
    topo.appendChild(espaco);

    var acoes = document.createElement("div");
    acoes.className = "acoes";

    var pular = document.createElement("button");
    pular.className = "miniBtn pular" + (st==="pulada" ? " on" : "");
    pular.title = st==="pulada" ? "Voltar para a pagar" : "Pular este mês";
    pular.textContent = "–";
    pular.addEventListener("click", function(){ definirStatus(c, dataCol, st==="pulada" ? "aberta" : "pulada"); salvar(); render(); });
    acoes.appendChild(pular);

    var apagar = document.createElement("button");
    apagar.className = "miniBtn"; apagar.title = "Apagar conta"; apagar.textContent = "×";
    apagar.addEventListener("click", function(){
      if(c.repete === false){
        if(confirm('Apagar "' + c.nome + '"?')){ contas = contas.filter(function(x){ return x !== c; }); salvar(); render(); }
      } else { escolherExclusao(c, dataCol); }
    });
    acoes.appendChild(apagar);
    topo.appendChild(acoes);
    if(c.repete === false){
      var umaVez = document.createElement("span");
      umaVez.textContent = "1×"; umaVez.title = "Despesa única";

      topo.insertBefore(umaVez, acoes);

    wrap.appendChild(topo);

    var nome = document.createElement("div");
    nome.className = "nome"; nome.textContent = c.nome;
    wrap.appendChild(nome);

    var badge = document.createElement("div");
    badge.className = "badgePaga"; badge.textContent = "paga";
    wrap.appendChild(badge);

    var linha = document.createElement("div");
    linha.className = "linhaValor";
    var cif = document.createElement("span"); cif.className = "cifrao"; cif.textContent = "R$";
    var input = document.createElement("input");
    input.type = "text"; input.inputMode = "decimal"; input.value = c.valor; input.placeholder = "preencher";
    input.addEventListener("input", function(){ c.valor = input.value; salvar(); atualizarTotais(); });
    input.addEventListener("blur", function(){
      c.valor = c.valor.trim() ? formatValor(parseValor(c.valor)) : "";
      input.value = c.valor; salvar(); atualizarTotais(); aplicarPendente();
    });
    linha.appendChild(cif); linha.appendChild(input);

    return wrap;

  function render(){
    var grade = document.getElementById("grade");
    grade.innerHTML = "";
    refDias = []; refTotDia = [];

    for(var i=0;i<7;i++){
      var data = addDias(inicioSemana, i);
      refDias.push(data);
      var ehHoje = mesmoDia(data, hoje);

      var col = document.createElement("div");
      col.className = "coluna" + (ehHoje ? " hoje" : "");
      col.setAttribute("data-dia", i);

      var cab = document.createElement("div");
      cab.className = "cabDia";
      cab.innerHTML = '<div class="dow">' + DOW[i] + '</div>' +
                      '<div class="num">' + data.getDate() + '</div>' +
                      '<div class="mes">' + MES_CURTO[data.getMonth()] + '</div>';
      col.appendChild(cab);

      var corpo = document.createElement("div");
      corpo.className = "corpo";
      var doDia = contasDoDia(data);
      if(doDia.length === 0){
        var vazio = document.createElement("div"); vazio.className = "vazio"; vazio.textContent = "sem contas";
        corpo.appendChild(vazio);
      } else {

      var rod = document.createElement("div");
      rod.className = "rodapeDia";
      var totEl = document.createElement("span"); totEl.className = "val"; totEl.textContent = "R$ 0,00";
      refTotDia.push(totEl);
      rod.innerHTML = '<span class="rot">A pagar</span>';
      rod.appendChild(totEl);
      col.appendChild(rod);

      grade.appendChild(col);
    }

    var fim = addDias(inicioSemana, 6);
    var ini = inicioSemana;
    var label;
    if(ini.getMonth() === fim.getMonth()){
      label = ini.getDate() + " a " + fim.getDate() + " de " + MESES[fim.getMonth()] + " de " + fim.getFullYear();
    } else {
      label = ini.getDate() + " de " + MESES[ini.getMonth()] + " a " + fim.getDate() + " de " + MESES[fim.getMonth()] + " de " + fim.getFullYear();

    var contemHoje = false;
    for(var j=0;j<7;j++){ if(mesmoDia(addDias(inicioSemana,j), hoje)) contemHoje = true; }
    document.getElementById("semanaLabel").textContent = contemHoje ? "Esta semana" : (MESES[ini.getMonth()].charAt(0).toUpperCase()+MESES[ini.getMonth()].slice(1));

    atualizarTotais();
  }

  var fantasma = null;
  function moverOcorrencia(conta, dataOrigem, destino){
    if(conta.repete === false){ conta.data = chaveDia(destino); return; }
    var ym = chaveMes(dataOrigem.getFullYear(), dataOrigem.getMonth());
    conta.removidos = conta.removidos || [];
    if(conta.removidos.indexOf(ym) === -1) conta.removidos.push(ym);
    contas.push({ id:"c"+Date.now()+Math.floor(Math.random()*1000), nome:conta.nome, tipo:conta.tipo, valor:conta.valor, status:"aberta", repete:false, data:chaveDia(destino) });
  }
  function nudge(conta, dataCol, delta){
    var destino = addDias(dataCol, delta);
    moverOcorrencia(conta, dataCol, destino);
    salvar();
    var fim = addDias(inicioSemana, 6);
    if(destino < inicioSemana || destino > fim){
      inicioSemana = segundaDaSemana(destino);
      render();
      toast("Despesa movida para " + destino.getDate() + "/" + (destino.getMonth()+1) + ".");
      return;
    }
    render();
  }
  function escolherExclusao(conta, dataCol){
    var y=dataCol.getFullYear(), m=dataCol.getMonth(), ym=chaveMes(y,m);
    var over=document.createElement("div"); over.className="delOverlay";
    var box=document.createElement("div"); box.className="delBox";

    var s=document.createElement("div"); s.className="delSub"; s.textContent="Essa despesa se repete todo mês. O que você quer apagar?";
    var b1=document.createElement("button"); b1.className="btnAcao"; b1.textContent="Só em "+nomeMesAno(y,m);
    var b2=document.createElement("button"); b2.className="btnAcao forte"; b2.textContent="Em todos os meses";
    var b3=document.createElement("button"); b3.className="btnAcao"; b3.textContent="Cancelar";
    function fechar(){ over.remove(); }
    b1.addEventListener("click", function(){ conta.removidos=conta.removidos||[]; if(conta.removidos.indexOf(ym)===-1) conta.removidos.push(ym); salvar(); fechar(); render(); });
    b2.addEventListener("click", function(){ contas=contas.filter(function(x){ return x!==conta; }); salvar(); fechar(); render(); });
    b3.addEventListener("click", fechar);
    over.addEventListener("click", function(e){ if(e.target===over) fechar(); });
    var a=document.createElement("div"); a.className="delAcoes"; a.appendChild(b1); a.appendChild(b2); a.appendChild(b3);
    box.appendChild(t); box.appendChild(s); box.appendChild(a); over.appendChild(box); document.body.appendChild(over);
  }
  function iniciarArraste(e, conta, dataOrigem){
    e.preventDefault();
    var startX = e.clientX, startY = e.clientY, comecou = false;
    function mover(ev){
      var dx = ev.clientX - startX, dy = ev.clientY - startY;
      if(!comecou && Math.sqrt(dx*dx+dy*dy) > 6){
        comecou = true;
        fantasma = document.createElement("div");
        fantasma.className = "fantasma";
        fantasma.style.background = conta.tipo === "empresa" ? "#0f2133" : "#89a5c0";
        fantasma.textContent = conta.nome;
        document.body.appendChild(fantasma);
      }
      if(comecou){
        fantasma.style.left = ev.clientX + "px";
        fantasma.style.top = ev.clientY + "px";
        marcarAlvo(ev.clientX, ev.clientY);
      }
    }
    function soltar(ev){
      window.removeEventListener("pointermove", mover);
      window.removeEventListener("pointerup", soltar);
      if(comecou){
        var col = colunaEm(ev.clientX, ev.clientY);
        if(col){
          var idx = Number(col.getAttribute("data-dia"));
          moverOcorrencia(conta, dataOrigem, addDias(inicioSemana, idx));
          salvar();
        }
        if(fantasma){ fantasma.remove(); fantasma = null; }
        limparAlvo();
        render();
      }
    }
    window.addEventListener("pointermove", mover);
    window.addEventListener("pointerup", soltar);
  }
  function colunaEm(x,y){ var el = document.elementFromPoint(x,y); return el ? el.closest("[data-dia]") : null; }
  function marcarAlvo(x,y){ limparAlvo(); var col = colunaEm(x,y); if(col) col.classList.add("alvo"); }
  function limparAlvo(){ var todas = document.querySelectorAll(".coluna.alvo"); for(var i=0;i<todas.length;i++) todas[i].classList.remove("alvo"); }

  document.getElementById("antes").addEventListener("click", function(){ inicioSemana = addDias(inicioSemana, -7); render(); });
  document.getElementById("depois").addEventListener("click", function(){ inicioSemana = addDias(inicioSemana, 7); render(); });
  document.getElementById("btnHoje").addEventListener("click", function(){ inicioSemana = segundaDaSemana(new Date()); render(); });

  document.getElementById("btnReset").addEventListener("click", function(){
    if(confirm("Restaurar as contas originais e perder as alterações?")){ contas = semear(); salvar(); render(); }
  });

  var form = document.getElementById("form");
  var btnNova = document.getElementById("btnNova");
  function toast(msg){
    var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.classList.add("show"); },20);
    setTimeout(function(){ t.classList.remove("show"); setTimeout(function(){ t.remove(); },260); },2600);
  }
  btnNova.addEventListener("click", function(){
    var aberto = form.classList.toggle("aberto");
    btnNova.textContent = aberto ? "Fechar" : "Adicionar conta";
    if(aberto){ setTimeout(function(){ form.scrollIntoView({behavior:"smooth", block:"center"}); },40); }
  });
  document.getElementById("fEmpresa").addEventListener("click", function(){ tipoNovo="empresa"; this.classList.add("sel"); document.getElementById("fPessoal").classList.remove("sel"); });
  document.getElementById("fPessoal").addEventListener("click", function(){ tipoNovo="pessoal"; this.classList.add("sel"); document.getElementById("fEmpresa").classList.remove("sel"); });
  var repeteNovo = true;
  document.getElementById("fRepMensal").addEventListener("click", function(){
    repeteNovo = true; this.classList.add("sel"); document.getElementById("fRepUnica").classList.remove("sel");
    document.getElementById("campoDia").style.display = ""; document.getElementById("campoData").style.display = "none";
  });
  document.getElementById("fRepUnica").addEventListener("click", function(){
    repeteNovo = false; this.classList.add("sel"); document.getElementById("fRepMensal").classList.remove("sel");
    document.getElementById("campoDia").style.display = "none"; document.getElementById("campoData").style.display = "";
  });
  document.getElementById("fAdd").addEventListener("click", function(){
    var nome = document.getElementById("fNome").value.trim();
    var valor = document.getElementById("fValor").value.trim();
    if(!nome){ alert("Escreva o nome da conta."); return; }
    var alvo;
    if(repeteNovo){
      var dia = parseInt(document.getElementById("fDia").value, 10);
      if(!dia || dia < 1 || dia > 31){ alert("Escolha um dia do mês entre 1 e 31."); return; }
      contas.push({ id:"c"+Date.now(), nome:nome, tipo:tipoNovo, dia:dia, valor: valor ? formatValor(parseValor(valor)) : "", status:"aberta", repete:true, removidos:[] });
      var refm = addDias(inicioSemana, 3);
      alvo = new Date(refm.getFullYear(), refm.getMonth(), Math.min(dia, ultimoDia(refm.getFullYear(), refm.getMonth())));
      toast("Despesa mensal adicionada no dia " + dia + ".");
    } else {
      var dataStr = document.getElementById("fData").value;
      var dt = fromISO(dataStr);
      if(!dt){ alert("Escolha uma data para a despesa única."); return; }
      contas.push({ id:"c"+Date.now(), nome:nome, tipo:tipoNovo, data:dataStr, valor: valor ? formatValor(parseValor(valor)) : "", status:"aberta", repete:false });
      alvo = dt;
      toast("Despesa única adicionada em " + dt.getDate() + "/" + (dt.getMonth()+1) + ".");
    }
    document.getElementById("fNome").value = ""; document.getElementById("fValor").value = "";
    inicioSemana = segundaDaSemana(alvo);
    salvar(); form.classList.remove("aberto"); btnNova.textContent = "Adicionar conta"; render();
  });

  refEmpresa = document.getElementById("totEmpresa");
  refPessoal = document.getElementById("totPessoal");
  refGeral = document.getElementById("totGeral");
  refPago = document.getElementById("totPago");

  function localInit(){
    store.get(CHAVE).then(function(salvo){
      if(salvo){ try{ contas = normalizar(JSON.parse(salvo)); }catch(e){ contas = semear(); } }
      else { contas = semear(); }
      render();
    });
  }

  function atualizarBarra(){
    var barra=document.getElementById("authBar"), status=document.getElementById("authStatus");
    var bIn=document.getElementById("btnEntrar"), bOut=document.getElementById("btnSair");
    if(!NUVEM){ if(barra) barra.style.display="none"; return; }
    if(barra) barra.style.display="flex";
    if(usuario){
      status.textContent="Sincronizando como "+(usuario.email||"sua conta");
      bIn.style.display="none"; bOut.style.display="inline-block";
    } else {
      status.textContent="Entre com o Google para ver e sincronizar suas contas.";
      bIn.style.display="inline-block"; bOut.style.display="none";
    }
  }

  function iniciarNuvem(){
    firebase.initializeApp(firebaseConfig);
    try{ firebase.firestore().enablePersistence({ synchronizeTabs:true }).catch(function(){}); }catch(e){}
    var provider=new firebase.auth.GoogleAuthProvider();
    document.getElementById("btnEntrar").addEventListener("click", function(){
      firebase.auth().signInWithPopup(provider).catch(function(){ firebase.auth().signInWithRedirect(provider); });
    });
    document.getElementById("btnSair").addEventListener("click", function(){ firebase.auth().signOut(); });
    firebase.auth().onAuthStateChanged(function(user){
      usuario=user||null; atualizarBarra();
      var grade=document.getElementById("grade");
      if(!user){
        docRef=null; contas=[];
        if(grade){ grade.innerHTML='<div style="padding:30px 10px;color:var(--cinzaTx);font-size:14px;">Entre com o Google acima para carregar suas contas.</div>'; }
        return;
      }
      docRef=firebase.firestore().collection("despesas").doc(user.uid);
      docRef.onSnapshot(function(snap){
        if(!snap.exists){
          contas=semear(); lastJSON=JSON.stringify(contas);
          docRef.set({ contas:contas, atualizadoEm:Date.now() });
          render(); return;
        }
        var remoto=snap.data().contas||[];
        var incoming=JSON.stringify(remoto);
        if(incoming===JSON.stringify(contas)) return;
        var foco=document.activeElement && document.activeElement.tagName==="INPUT" && document.activeElement.closest && document.activeElement.closest(".grade");
        if(foco){ pendingRemote=remoto; }
        else { contas=normalizar(remoto); lastJSON=incoming; render(); }
      }, function(err){ console.warn("Erro de sincronizacao:", err); });
    });
  }

  // ---- Calculadora de pagamento (somente leitura, nao altera o pagamento real) ----
  var ESSENCIAIS_IDS = ["google","agua","light","vivo","primazia","acordolucas","acordofernanda","ifood","riocard","omie","oi","aluguel"];
  var calcSel = {};
  var calcSaldo = 0;

  function itensCalc(){
    var ref = addDias(inicioSemana, 3);
    var ano = ref.getFullYear(), mes = ref.getMonth(), ult = ultimoDia(ano, mes), ym = chaveMes(ano, mes);
    var lista = [];
    contas.forEach(function(c){
      if(c.repete === false){
        if((c.status || "aberta") !== "aberta") return;
        var dt = fromISO(c.data); if(!dt) return;
        if(dt.getFullYear()===ano && dt.getMonth()===mes){
          lista.push({ id:c.id, nome:c.nome, dia:dt.getDate(), valor:parseValor(c.valor), tipo:c.tipo, atrasada: dt < hoje });
        }
      } else {
        if(c.removidos && c.removidos.indexOf(ym) !== -1) return;
        if(((c.statusMes && c.statusMes[ym]) || "aberta") !== "aberta") return;
        var d = Math.min(c.dia, ult); var venc = new Date(ano, mes, d); venc.setHours(0,0,0,0);
        lista.push({ id:c.id, nome:c.nome, dia:d, valor:parseValor(c.valor), tipo:c.tipo, atrasada: venc < hoje });
      }
    });
    lista.sort(function(a,b){ return a.dia - b.dia; });
    return lista;
  }

  function atualizarResumoCalc(lista){
    var total = 0;
    lista.forEach(function(it){ if(calcSel[it.id]) total += it.valor; });
    document.getElementById("calcTotal").textContent = "R$ " + formatValor(total);
    var difEl = document.getElementById("calcDif");
    if(calcSaldo > 0){
      var dif = calcSaldo - total;
      difEl.style.display = "flex";
      difEl.className = "calcDif " + (dif >= 0 ? "sobra" : "falta");
      document.getElementById("calcDifRot").textContent = dif >= 0 ? "Sobra após pagar" : "Falta";
      document.getElementById("calcDifVal").textContent = "R$ " + formatValor(Math.abs(dif));
    } else { difEl.style.display = "none"; }
  }

  function renderCalc(){
    var lista = itensCalc();
    var box = document.getElementById("calcLista");
    box.innerHTML = "";
    if(lista.length === 0){
      var v = document.createElement("div");
      v.style.cssText = "padding:24px 8px;text-align:center;color:var(--cinzaTx);font-size:14px;";
      v.textContent = "Nenhuma conta em aberto neste mês.";
      box.appendChild(v);
    }
    lista.forEach(function(it){
      var row = document.createElement("div");
      row.className = "calcRow" + (calcSel[it.id] ? " sel" : "");
      row.addEventListener("click", function(){
        if(calcSel[it.id]) delete calcSel[it.id]; else calcSel[it.id] = true;
        renderCalc();
      });
      var chk = document.createElement("div"); chk.className = "calcCheck";
      if(calcSel[it.id]){ chk.innerHTML = '<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 6.5 L5 9.5 L10 3" fill="none" stroke="#f2f7fb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
      row.appendChild(chk);
      var dia = document.createElement("div"); dia.className = "calcDia"; dia.textContent = it.dia; row.appendChild(dia);
      var tag = document.createElement("div");
      if(it.atrasada){ tag.className = "calcTag tagAtraso"; tag.textContent = "!"; tag.title = "Atrasada"; }
      else if(it.tipo === "pessoal"){ tag.className = "calcTag tagP"; tag.textContent = "P"; tag.title = "Pessoal"; }
      else { tag.className = "calcTag tagE"; tag.textContent = "E"; tag.title = "Empresa"; }
      row.appendChild(tag);
      var nome = document.createElement("div"); nome.className = "calcNome"; nome.textContent = it.nome; row.appendChild(nome);
      var val = document.createElement("div"); val.className = "calcValor";
      if(it.valor > 0){ val.textContent = "R$ " + formatValor(it.valor); }
      else { val.textContent = "sem valor"; val.style.color = "var(--cinzaTx)"; val.style.fontWeight = "500"; }
      row.appendChild(val);
      box.appendChild(row);
    });
    atualizarResumoCalc(lista);
  }

  function abrirCalc(){ document.getElementById("calcOverlay").classList.add("aberto"); renderCalc(); }
  function fecharCalc(){ document.getElementById("calcOverlay").classList.remove("aberto"); }

  document.getElementById("btnCalc").addEventListener("click", abrirCalc);
  document.getElementById("calcFechX").addEventListener("click", fecharCalc);
  document.getElementById("calcOverlay").addEventListener("click", function(e){ if(e.target === this) fecharCalc(); });
  document.getElementById("calcSaldoInput").addEventListener("input", function(){ calcSaldo = parseValor(this.value); atualizarResumoCalc(itensCalc()); });
  document.getElementById("calcSaldoInput").addEventListener("blur", function(){ this.value = this.value.trim() ? "R$ " + formatValor(parseValor(this.value)) : ""; });
  document.getElementById("calcAtrasadas").addEventListener("click", function(){ itensCalc().forEach(function(it){ if(it.atrasada) calcSel[it.id] = true; }); renderCalc(); });
  document.getElementById("calcEssenciais").addEventListener("click", function(){
    var ids = itensCalc().map(function(it){ return it.id; });
    ESSENCIAIS_IDS.forEach(function(id){ if(ids.indexOf(id) !== -1) calcSel[id] = true; });
    renderCalc();
  });
  document.getElementById("calcLimpar").addEventListener("click", function(){ calcSel = {}; renderCalc(); });

  // ---- Relatório do mês (para atualizar o Google Calendar) ----
  var relTextoAtual = "";
  function itensDoMes(ano, mes){
    var ult = ultimoDia(ano, mes), ym = chaveMes(ano, mes);
    var lista = [];
    contas.forEach(function(c){
      if(c.repete === false){
        var dt = fromISO(c.data); if(!dt) return;
        if(dt.getFullYear()===ano && dt.getMonth()===mes){
          lista.push({ nome:c.nome, dia:dt.getDate(), valor:c.valor, tipo:c.tipo, status:(c.status||"aberta"), repete:false });
        }
      } else {
        if(c.removidos && c.removidos.indexOf(ym) !== -1) return;
        var d = Math.min(c.dia, ult);
        var stt = (c.statusMes && c.statusMes[ym]) || "aberta";
        lista.push({ nome:c.nome, dia:d, valor:c.valor, tipo:c.tipo, status:stt, repete:true });
      }
    });
    lista.sort(function(a,b){ return a.dia - b.dia; });
    return lista;
  }
  var GRUPOS_REL = [{ r:true, tela:"Contas mensais (repetem todo mês)", texto:"CONTAS MENSAIS (repetem todo mês)" },
                    { r:false, tela:"Contas únicas (só neste mês)", texto:"CONTAS ÚNICAS (só neste mês)" }];
  function montarTextoRelatorio(ano, mes, lista){
    var linhas = ["Relatório de despesas — " + nomeMesAno(ano, mes), ""];
    GRUPOS_REL.forEach(function(g){
      var doGrupo = lista.filter(function(it){ return it.repete === g.r; });
      if(doGrupo.length === 0) return;
      linhas.push(g.texto);
      ["empresa","pessoal"].forEach(function(tp){
        var itens = doGrupo.filter(function(it){ return it.tipo===tp; });
        if(itens.length===0) return;
        linhas.push("  " + (tp==="empresa"?"Empresa":"Pessoal") + ":");
        itens.forEach(function(it){
          var quando = g.r ? ("todo dia "+it.dia) : (pad2(it.dia)+"/"+pad2(mes+1)+"/"+ano);
          linhas.push("    " + quando + " — " + it.nome + " — " +
            (parseValor(it.valor)>0 ? "R$ "+it.valor : "(a preencher)") +
            (it.status!=="aberta" ? "  ["+it.status+"]" : ""));
        });
      });
      linhas.push("");
    });
    return linhas.join("\n");
  }
  function abrirRelatorio(){
    var ref = addDias(inicioSemana, 3);
    var ano = ref.getFullYear(), mes = ref.getMonth();
    document.getElementById("relMes").textContent = "Mês: " + nomeMesAno(ano, mes);
    var lista = itensDoMes(ano, mes);
    var box = document.getElementById("relLista"); box.innerHTML = "";
    if(lista.length === 0){
      var vazio = document.createElement("div");
      vazio.style.cssText = "padding:24px 8px;text-align:center;color:var(--cinzaTx);font-size:14px;";
      vazio.textContent = "Nenhuma despesa neste mês.";
      box.appendChild(vazio);
    }
    GRUPOS_REL.forEach(function(g){
      var doGrupo = lista.filter(function(it){ return it.repete === g.r; });
      if(doGrupo.length === 0) return;
      var gh = document.createElement("div");
      gh.textContent = g.tela;
      gh.style.cssText = "font-family:var(--serif);font-weight:700;color:var(--vinho);margin:12px 2px 6px;font-size:15px;border-bottom:1px solid rgba(62,76,89,.2);padding-bottom:4px;";
      box.appendChild(gh);
      ["empresa","pessoal"].forEach(function(tp){
        var itens = doGrupo.filter(function(it){ return it.tipo===tp; });
        if(itens.length===0) return;
        var th = document.createElement("div");
        th.textContent = (tp==="empresa"?"Empresa":"Pessoal");
        th.style.cssText = "font-weight:700;color:"+(tp==="empresa"?"#0f2133":"#3e4c59")+";margin:6px 2px 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;";
        box.appendChild(th);
        itens.forEach(function(it){
          var row = document.createElement("div");
          row.style.cssText = "display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:8px;background:#f7fafd;border:1px solid rgba(25,38,51,.08);margin-bottom:4px;font-size:13px;";
          var esq = document.createElement("span");
          var quando = g.r ? ("todo dia "+it.dia) : (pad2(it.dia)+"/"+pad2(mes+1));
          esq.textContent = quando + "  " + it.nome + (it.status!=="aberta"?"  ("+it.status+")":"");
          var dir = document.createElement("span");
          dir.style.cssText = "font-family:var(--serif);font-weight:700;white-space:nowrap;";
          dir.textContent = parseValor(it.valor)>0 ? "R$ "+it.valor : "sem valor";
          row.appendChild(esq); row.appendChild(dir); box.appendChild(row);
        });
      });
    });
    relTextoAtual = montarTextoRelatorio(ano, mes, lista);
    document.getElementById("relOverlay").classList.add("aberto");
  }
  function copiarRelatorio(){
    var txt = relTextoAtual || "";
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("Relatório copiado. Cole na conversa com o Claude."); }).catch(function(){ fallbackCopiar(txt); });
    } else { fallbackCopiar(txt); }
  }
  function fallbackCopiar(txt){
    var ta = document.createElement("textarea"); ta.value = txt;
    ta.style.cssText = "position:fixed;left:-9999px;top:0;"; document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand("copy"); toast("Relatório copiado."); }catch(e){ toast("Não consegui copiar sozinho, selecione o texto manualmente."); }
    ta.remove();
  }
  document.getElementById("btnRelatorio").addEventListener("click", abrirRelatorio);
  document.getElementById("relFechX").addEventListener("click", function(){ document.getElementById("relOverlay").classList.remove("aberto"); });
  document.getElementById("relOverlay").addEventListener("click", function(e){ if(e.target===this) this.classList.remove("aberto"); });
  document.getElementById("relCopiar").addEventListener("click", copiarRelatorio);

  if(NUVEM){ iniciarNuvem(); } else { atualizarBarra(); localInit(); }
})();
</script>
